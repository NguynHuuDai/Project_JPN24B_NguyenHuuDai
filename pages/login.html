<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="input-content">
        <div class="title">
            <h1>Đăng nhập</h1>
            <p>Đăng nhập để sử dụng hệ thống quản lý.</p>
        </div>
        <div class="input">
            <p>Email</p>
            <input type="text" id="email">
        </div>
        <div class="input">
            <p>Mật khẩu</p>
            <input type="password" id="matKhau">
        </div>
        <p id="loiMatKhau" class="thong-bao-loi"></p>
        <div class="checkbox">
            <input type="checkbox" id="checkbox" name="checkbox" value="Boat">
            <label for="checkbox">Nhớ tài khoản</label> <a href="">Quên mật khẩu?</a>
        </div>
        
        <button id="btnDangNhap">Đăng nhập</button>
        
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
