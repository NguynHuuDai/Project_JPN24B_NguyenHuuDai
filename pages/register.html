<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng kí tài khoản</title>
    <link rel="stylesheet" href="/css/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Grechen+Fuemen&family=Heebo:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="content">
        <div class="heading-and-supporting-text">
            <h2>Đăng ký tài khoản</h2>
            <p>Đăng ký tài khoản để sử dụng dịch vụ</p>
        </div>
    </div>

    <div class="container">
        <div class="content-2">
            <div class="form">
                <div class="row">
                    <div class="input_field">
                        <p>Họ và tên đệm</p>
                        <input type="text" id="hoVaTenDem">
                        <p class="error-message" id="loiHoVaTenDem"></p>
                    </div>
                    <div class="input_field">
                        <p>Tên</p>
                        <input type="text" id="ten">
                        <p class="error-message" id="loiTen"></p>
                    </div>
                </div>

                <div class="input-field">
                    <p>Email</p>
                    <input type="text" id="email" placeholder="you@company.com">
                    <p class="error-message" id="loiEmail"></p>
                </div>

                <div class="pass">
                    <p>Mật khẩu</p>
                    <input type="password" id="matKhau">
                    <p class="error-message" id="loiMatKhau"></p>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="checkbox" name="checkbox" value="Boat">
                    <label for="checkbox">Bạn đồng ý với&nbsp;<span>chính sách và điều khoản</span></label>
                </div>

                <button type="submit" id="btnDangKy">Đăng ký</button>
            </div>

            <span>Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a></span>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>

</html>
